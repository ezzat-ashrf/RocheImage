<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#08001f">
  <title>Vabysmo Commitment Wall</title>
  <link rel="stylesheet" href="styles.css?v=20261021-name-photo-1">
</head>
<body>
  <section id="welcomeScreen" class="welcome-screen" aria-label="Welcome screen">
    <div class="welcome-art">
      <img src="commitment-welcome.png" alt="Vabysmo commitment wall welcome screen">
      <button id="startButton" class="welcome-start" type="button" aria-label="Start"></button>
    </div>
  </section>

  <main id="registrationPage" class="page-shell" aria-hidden="true">
    <header class="brand-header" aria-label="Vabysmo and Roche">
      <img src="brand-header.png" alt="Vabysmo and Roche">
    </header>

    <form id="registrationForm" novalidate>
      <div class="photo-section">
        <label class="photo-picker" for="photoInput">
          <img id="photoPreview" alt="Your selected photo preview">
          <span id="photoPrompt">
            <b aria-hidden="true">+</b>
            <strong>TAP TO ADD PHOTO</strong>
          </span>
        </label>
        <input id="photoInput" type="file" accept="image/*" capture="user" required>
      </div>

      <div class="photo-copy">
        <h1>ADD YOUR PHOTO</h1>
        <p>Add your name and share your photo on the big screen</p>
      </div>

      <label class="name-field" for="nameInput">
        <span>YOUR NAME</span>
        <input id="nameInput" type="text" maxlength="30" autocomplete="name" placeholder="Enter your name" required>
      </label>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="submitButton" type="submit">SEND PHOTO</button>
    </form>
  </main>

  <script src="app.js?v=20261021-name-photo-1"></script>
</body>
</html>
